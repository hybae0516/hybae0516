name: 오늘의 한 줄 업데이트

on:
  schedule:
    - cron: "7 0 * * *" # 매일 00:07 UTC = 09:07 KST
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 오늘의 한 줄 고르기
        run: python3 scripts/update_quote.py

      - name: 변경 사항 커밋
        run: |
          if git diff --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "💬 오늘의 한 줄 업데이트"
          git push
